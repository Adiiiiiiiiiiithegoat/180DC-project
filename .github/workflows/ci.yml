name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # CI's database is this service container: a fresh, empty postgres:16 that
    # exists only for the life of the job. There is no DATABASE_URL anywhere in
    # this workflow that points anywhere else, so CI structurally cannot reach
    # the production database — not "won't", cannot, because it is never told
    # its address.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Dummy values, never real secrets. Nothing here is added to GitHub
      # secrets, and nothing needs to be: the database above is disposable and
      # the app talks to no external service during typecheck or npm test.
      BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-do-not-use-in-production
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # pg_trgm is enabled by the first migration (drizzle/0000_extensions.sql)
      # itself, so running migrations is the "enable pg_trgm" step.
      - name: Run migrations
        run: npm run db:migrate

      # tsc alone doesn't know about Next.js's generated route/page/layout
      # types (RouteContext, PageProps, LayoutProps) — `next dev`/`next build`
      # normally produce them as a side effect. A fresh checkout has neither,
      # so generate them explicitly first.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      # No lint step: this project has no ESLint dependency or config, and
      # Next.js 16 removed `next lint` outright. There is nothing installed to
      # run here. Add eslint + a config first if you want lint in CI.
      #
      # Runs every src/**/*.test.ts except analytics.test.ts by literal
      # filename, so a new test file is included by default without this
      # workflow needing to know it exists. analytics.test.ts is excluded
      # deliberately, not accidentally skipped: by its own header comment it
      # is a "Phase 6 oracle test" whose expected figures are hardcoded from
      # one specific `npm run seed` run against the hand-seeded Neon `local`
      # branch on a specific date. A fresh, empty CI database can never
      # satisfy it, and reseeding it here wouldn't help either — the seed
      # always covers "90 days ending yesterday", which will never again line
      # up with this test's pinned date and figures. `npm test` (no "npm run",
      # so the local default) still runs it; only CI excludes it. test:live
      # (calls the real Groq API) is a separate script and never runs here.
      - name: Test
        run: |
          files=$(find src -type f -name '*.test.ts' ! -name 'analytics.test.ts' | sort)
          echo "CI runs:"
          printf '  %s\n' $files
          echo "CI skips: src/lib/analytics.test.ts (oracle test pinned to the seeded local branch — see comment above)"
          npx tsx --conditions=react-server --experimental-test-module-mocks --test --test-concurrency=1 $files

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, not just this commit — gitleaks needs it to see anything ever committed.

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # auto-provided per run by GitHub, not a secret we add.
